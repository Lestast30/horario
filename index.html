<style>
/* ─── Tokens — dark-first wellness palette ─── */
:root {
  --bg: #0e0c17;
  --surface: #19162a;
  --surface2: #221f36;
  --border: #2e2a48;
  --fg: #edeaff;
  --fg-muted: #8a849f;
  --fg-dim: #4d496a;

  --c-yoga:    #64c5a8;
  --c-kryon:   #b89ef5;
  --c-omm:     #f0a06e;
  --c-liza:    #f07daa;
  --c-uriel:   #7bbff5;
  --c-medit:   #90dbb5;
  --c-terapia: #f2728a;
  --c-trasl:   #5d5f72;

  --font-d: 'Fraunces', Georgia, serif;
  --font-u: 'Plus Jakarta Sans', system-ui, sans-serif;

  --radius-pill: 9px;
  --radius-modal: 22px;

  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f2ff;
    --surface: #ffffff;
    --surface2: #ebe8ff;
    --border: #d6d0f5;
    --fg: #1a1530;
    --fg-muted: #6a6188;
    --fg-dim: #b0aac8;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f2ff;
  --surface: #ffffff;
  --surface2: #ebe8ff;
  --border: #d6d0f5;
  --fg: #1a1530;
  --fg-muted: #6a6188;
  --fg-dim: #b0aac8;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-u);
  background: var(--bg);
  color: var(--fg);
  min-height: 100%;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ─── Header ─── */
header {
  text-align: center;
  margin-bottom: 28px;
}
.header-eyebrow {
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-bottom: 8px;
}
header h1 {
  font-family: var(--font-d);
  font-weight: 300;
  font-size: clamp(1.9rem, 5vw, 2.8rem);
  letter-spacing: -0.01em;
  text-wrap: balance;
  line-height: 1.1;
  color: var(--fg);
}
header h1 em {
  font-style: italic;
  color: var(--c-kryon);
}
.header-sub {
  margin-top: 8px;
  font-size: 0.78rem;
  color: var(--fg-muted);
}

/* ─── Toolbar ─── */
.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.leg-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.72rem;
  color: var(--fg-muted);
  cursor: default;
}
.leg-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}
.icon-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  font-family: var(--font-u);
  font-size: 0.78rem;
  color: var(--fg-muted);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
}
.icon-btn:hover { background: var(--surface2); color: var(--fg); }

/* ─── Day nav (mobile) ─── */
.day-nav {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.day-nav-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50%;
  width: 38px; height: 38px;
  font-size: 1.1rem;
  color: var(--fg-muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.12s, color 0.12s;
}
.day-nav-btn:hover { background: var(--surface2); color: var(--fg); }
.day-nav-label {
  font-family: var(--font-d);
  font-size: 1.3rem;
  font-weight: 300;
  color: var(--fg);
  text-align: center;
  flex: 1;
}
.day-dots {
  display: flex; gap: 5px; justify-content: center;
}
.day-dot {
  width: 6px; height: 6px; border-radius: 50%;

  transition: background 0.15s, transform 0.15s;
}
.day-dot.active { background: var(--c-kryon); transform: scale(1.3); }

/* ─── Mobile day view ─── */
.mobile-day {
  display: none;
  flex-direction: column;
  gap: 8px;
}
.mobile-slot {
  display: flex;
  align-items: stretch;
  gap: 10px;
  min-height: 56px;
}
.mobile-slot.is-break {
  align-items: center;
  min-height: 28px;
}
.mobile-time {
  width: 52px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-top: 4px;
}
.mobile-time .ts { font-size: 0.72rem; font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
.mobile-time .te { font-size: 0.6rem; color: var(--fg-dim); }
.mobile-break-label {
  flex: 1;
  font-size: 0.65rem;
  color: var(--fg-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-top: 1px solid var(--border);
  display: flex; align-items: center;
}
.mobile-cell {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  position: relative;
  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

}
.mobile-cell:active { filter: brightness(1.06); }
.mobile-pill {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: 8px 12px;
  border-radius: 11px;
  font-size: 0.82rem;
  font-weight: 600;
  text-align: center;
  line-height: 1.3;
}
.mobile-add-hint {
  font-size: 1.2rem;
  color: var(--fg-dim);

}

/* ─── Table wrapper ─── */
.tbl-outer {
  overflow-x: auto;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: var(--surface);
}

table {
  width: 100%;
  min-width: 640px;
  border-collapse: collapse;
  table-layout: fixed;
}

/* Column widths */
col.time-col { width: 78px; }
col.day-col  { width: calc((100% - 78px) / 7); }

/* ─── Day headers ─── */
thead th {
  background: var(--surface);
  padding: 13px 6px;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-muted);
  text-align: center;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 2;
}
thead th:first-child {
  text-align: left;
  padding-left: 14px;
  border-right: 1px solid var(--border);
}

/* ─── Rows ─── */
tbody tr.break-row td {
  background: var(--bg);
  padding: 6px 14px;
  font-size: 0.68rem;
  color: var(--fg-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}

.time-td {
  padding: 0 8px 0 14px;
  font-size: 0.68rem;
  color: var(--fg-muted);
  white-space: nowrap;
  vertical-align: middle;
  font-variant-numeric: tabular-nums;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  line-height: 1.3;
  height: 56px;
}
.time-start { font-weight: 600; color: var(--fg); display: block; }
.time-end   { color: var(--fg-dim); display: block; font-size: 0.62rem; }

.act-td {
  padding: 4px;
  vertical-align: top;
  height: 56px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  cursor: pointer;
  position: relative;
  transition: background 0.1s;
}
.act-td:last-child { border-right: none; }
tbody tr:last-child td { border-bottom: none; }
.act-td:hover { background: color-mix(in srgb, var(--surface2) 60%, transparent); }

/* ─── Pills ─── */
.pill {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  min-height: 48px;
  border-radius: var(--radius-pill);
  font-size: 0.7rem;
  font-weight: 600;
  line-height: 1.25;
  text-align: center;
  padding: 4px 5px;
  cursor: pointer;
  transition: filter 0.15s, transform 0.1s;
  border: 1px solid transparent;
}
.pill:hover { filter: brightness(1.18); transform: scale(1.03); }
.pill-text { white-space: pre-wrap; word-break: break-word; }

/* ─── Empty cell add hint ─── */
.add-hint {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  color: var(--fg-dim);
  opacity: 0;
  transition: opacity 0.15s;
  pointer-events: none;
}
.act-td:hover .add-hint { opacity: 1; }

/* ─── Responsive: mobile hides table, shows day view ─── */
@media (max-width: 640px) {
  body { padding-block: 20px 32px; }
  .tbl-outer { display: none; }
  .day-nav   { display: flex; }
  .mobile-day { display: flex; }
  .toolbar { margin-bottom: 10px; }
  .legend { gap: 7px; }
  .leg-item { font-size: 0.67rem; }
}

/* ─── Modal ─── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 16px;
}
.modal {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-modal);
  padding: 26px 24px 22px;
  width: 100%;
  max-width: 370px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.5);
}
.modal-tag {
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-bottom: 4px;
}
.modal h3 {
  font-family: var(--font-d);
  font-weight: 300;
  font-size: 1.25rem;
  color: var(--fg);
  margin-bottom: 20px;
  text-wrap: balance;
}
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 0.7rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-bottom: 7px;
  font-weight: 600;
}
.field input {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 11px;
  padding: 10px 13px;
  font-family: var(--font-u);
  font-size: 0.9rem;
  color: var(--fg);
  outline: none;

}
.field input:focus { border-color: var(--c-kryon); }

/* Color swatches */
.swatches {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 7px;
  min-height: 28px;
}
.swatch {
  width: 100%;
  height: 28px;
  border-radius: 7px;
  cursor: pointer;
  border: 2.5px solid transparent;
  transition: transform 0.12s, border-color 0.12s;
}
.swatch:hover { transform: scale(1.15); }
.swatch.on { border-color: var(--fg); box-shadow: 0 0 0 2px var(--bg); }

.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 22px;
}
.btn {
  flex: 1;
  padding: 10px 8px;
  border-radius: 11px;
  border: none;
  font-family: var(--font-u);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: filter 0.12s, transform 0.1s;
}
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(0.97); }
.btn-cancel { background: var(--surface); color: var(--fg-muted); border: 1px solid var(--border); }
.btn-clear  { background: #2c1820; color: #f2728a; border: 1px solid #4a2535; }
.btn-save   { background: var(--c-kryon); color: #1a0d38; }

/* ─── Footer note ─── */
.note {
  text-align: center;
  font-size: 0.72rem;
  color: var(--fg-dim);
  margin-top: 16px;
}
</style>

<script>
// ── Time slots ──────────────────────────────────────────────────────────────
const SLOTS = [
  {s:'7:00',  e:'8:00'},
  {s:'8:00',  e:'9:00'},
  {s:'9:00',  e:'10:00'},
  {s:'10:00', e:'11:00'},
  {s:'11:00', e:'12:00'},
  {s:'12:00', e:'13:00'},
  'BREAK', // visual separator for 13–18
  {s:'18:00', e:'19:00'},
  {s:'19:00', e:'20:00'},
  {s:'20:00', e:'21:00'},
  {s:'21:00', e:'22:00'},
  {s:'22:30', e:'23:00'},
];

// Real slot indices (no BREAK)
const REAL = SLOTS.map((s,i)=>[s,i]).filter(([s])=>s!=='BREAK').map(([,i])=>i);
// Map slot index → data row (0..n)
function slotToRow(si){ return REAL.indexOf(si); }

const DAYS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const COLORS = [
  '#64c5a8','#b89ef5','#f0a06e','#f07daa',
  '#7bbff5','#90dbb5','#f2728a','#7a7c95',
  '#fbbf24','#34d399','#f87171','#c4b5fd',
  '#fb923c','#38bdf8','#e879f9','#4ade80',
];

// ── Default schedule (from image) ──────────────────────────────────────────
// key: "dataRowIndex-dayIndex"
// dataRow = 0..10 (skipping break)
const DEFAULT = {
  // Morning block: slots 0-5 → data rows 0-5
  '1-2':{t:'Traslado',        c:'#7a7c95'},
  '2-2':{t:'OMM',             c:'#f0a06e'},
  '2-3':{t:'Yoga Lab',        c:'#64c5a8'},
  '2-4':{t:'Yoga Lab',        c:'#64c5a8'},
  '2-5':{t:'Traslado',        c:'#7a7c95'},
  '3-2':{t:'Traslado',        c:'#7a7c95'},
  '3-3':{t:'Yoga Lab',        c:'#64c5a8'},
  '3-4':{t:'Yoga Lab',        c:'#64c5a8'},
  '3-5':{t:'Kryon',           c:'#b89ef5'},
  '4-4':{t:'Terapia\ncon Dani',c:'#f2728a'},
  '4-5':{t:'Kryon',           c:'#b89ef5'},
  '5-5':{t:'Traslado',        c:'#7a7c95'},
  // Evening block: slots after break → data rows 6-10
  '6-0':{t:'Kryon',           c:'#b89ef5'},
  '6-1':{t:'Traslado',        c:'#7a7c95'},
  '6-2':{t:'Yoga Lab',        c:'#64c5a8'},
  '6-3':{t:'Traslado',        c:'#7a7c95'},
  '7-0':{t:'Kryon / Liza',    c:'#b89ef5'},
  '7-1':{t:'OMM / Liza',      c:'#f0a06e'},
  '7-2':{t:'Yoga Lab / Liza', c:'#64c5a8'},
  '7-3':{t:'Rocket OMM\n/ Liza',c:'#f0a06e'},
  '7-4':{t:'Liza',            c:'#f07daa'},
  '7-5':{t:'Liza',            c:'#f07daa'},
  '7-6':{t:'Liza',            c:'#f07daa'},
  '8-0':{t:'Uriel',           c:'#7bbff5'},
  '8-1':{t:'Traslado',        c:'#7a7c95'},
  '8-2':{t:'Uriel',           c:'#7bbff5'},
  '8-3':{t:'Traslado',        c:'#7a7c95'},
  '9-0':{t:'Uriel',           c:'#7bbff5'},
  '9-2':{t:'Uriel',           c:'#7bbff5'},
  // Meditation (slot 11 → data row 10)
  '10-0':{t:'Meditación\ncon Quetzal',c:'#90dbb5'},
  '10-1':{t:'Meditación\ncon Quetzal',c:'#90dbb5'},
  '10-2':{t:'Meditación\ncon Quetzal',c:'#90dbb5'},
  '10-3':{t:'Meditación\ncon Quetzal',c:'#90dbb5'},
  '10-4':{t:'Meditación\ncon Quetzal',c:'#90dbb5'},
  '10-5':{t:'Meditación\ncon Quetzal',c:'#90dbb5'},
  '10-6':{t:'Meditación\ncon Quetzal',c:'#90dbb5'},
};

const KEY = 'horario_v2';
let data = {};

function load(){
  try { const s=localStorage.getItem(KEY); data=s?JSON.parse(s):{...DEFAULT}; }
  catch{ data={...DEFAULT}; }
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch{} }

// ── Color helpers ───────────────────────────────────────────────────────────
function hex2rgba(hex, a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── Render table ────────────────────────────────────────────────────────────
function render(){
  const body = document.getElementById('body');
  body.innerHTML='';
  let dataRow = 0;

  SLOTS.forEach((slot, si)=>{
    if(slot==='BREAK'){
      const tr=document.createElement('tr');
      tr.className='break-row';
      const td=document.createElement('td');
      td.colSpan=8;
      td.textContent='— tarde libre —';
      tr.appendChild(td);
      body.appendChild(tr);
      return;
    }

    const tr=document.createElement('tr');

    // Time cell
    const td0=document.createElement('td');
    td0.className='time-td';
    td0.innerHTML=`<span class="time-start">${slot.s}</span><span class="time-end">${slot.e}</span>`;
    tr.appendChild(td0);

    // Day cells
    for(let d=0;d<7;d++){
      const key=`${dataRow}-${d}`;
      const td=document.createElement('td');
      td.className='act-td';
      td.dataset.key=key;

      const entry=data[key];
      if(entry){
        const pill=document.createElement('div');
        pill.className='pill';
        pill.style.background=hex2rgba(entry.c, 0.22);
        pill.style.color=entry.c;
        pill.style.borderColor=hex2rgba(entry.c, 0.35);
        const sp=document.createElement('span');
        sp.className='pill-text';
        sp.textContent=entry.t;
        pill.appendChild(sp);
        pill.addEventListener('click',()=>openModal(key,entry,slot,d));
        td.appendChild(pill);
      } else {
        const hint=document.createElement('div');
        hint.className='add-hint';
        hint.textContent='+';
        td.appendChild(hint);
        td.addEventListener('click',()=>openModal(key,null,slot,d));
      }
      tr.appendChild(td);
    }

    body.appendChild(tr);
    dataRow++;
  });

  renderLegend();
}

// ── Legend ──────────────────────────────────────────────────────────────────
function renderLegend(){
  const seen=new Map();
  for(const v of Object.values(data)){
    const name=v.t.split('\n')[0].trim();
    if(!seen.has(name)) seen.set(name,v.c);
  }
  const el=document.getElementById('legend');
  el.innerHTML='';
  seen.forEach((c,name)=>{
    const item=document.createElement('div');
    item.className='leg-item';
    const dot=document.createElement('div');
    dot.className='leg-dot';
    dot.style.background=c;
    item.appendChild(dot);
    item.appendChild(document.createTextNode(name));
    el.appendChild(item);
  });
}

// ── Modal ───────────────────────────────────────────────────────────────────
let currentKey=null;
let currentColor=COLORS[0];

function openModal(key, entry, slot, di){
  currentKey=key;
  currentColor=entry?.c ?? COLORS[0];

  document.getElementById('mTag').textContent=`${DAYS[di]} · ${slot.s} – ${slot.e}`;
  document.getElementById('mTitle').textContent=entry?'Editar actividad':'Nueva actividad';
  document.getElementById('actInput').value=entry ? entry.t.replace(/\n/g,' ') : '';

  buildSwatches();
  document.getElementById('overlay').style.display='flex';
  document.getElementById('actInput').focus();
}

function closeModal(){
  document.getElementById('overlay').style.display='none';
  currentKey=null;
}

function buildSwatches(){
  const box=document.getElementById('swatches');
  box.innerHTML='';
  COLORS.forEach(c=>{
    const sw=document.createElement('div');
    sw.className='swatch'+(c===currentColor?' on':'');
    sw.style.background=c;
    sw.addEventListener('click',()=>{
      currentColor=c;
      box.querySelectorAll('.swatch').forEach(s=>s.classList.remove('on'));
      sw.classList.add('on');
    });
    box.appendChild(sw);
  });
}

function doSave(){
  if(!currentKey) return;
  const t=document.getElementById('actInput').value.trim();
  if(t) data[currentKey]={t,c:currentColor};
  else delete data[currentKey];
  save(); render(); renderMobile(); closeModal();
}

function doClear(){
  if(!currentKey) return;
  delete data[currentKey];
  save(); render(); renderMobile(); closeModal();
}

// ── Events ──────────────────────────────────────────────────────────────────
document.getElementById('btnSave').addEventListener('click', doSave);
document.getElementById('btnClear').addEventListener('click', doClear);
document.getElementById('btnCancel').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target===document.getElementById('overlay')) closeModal();
});
document.getElementById('actInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') doSave();
  if(e.key==='Escape') closeModal();
});

document.getElementById('themeBtn').addEventListener('click', ()=>{
  const r=document.documentElement;
  r.setAttribute('data-theme', r.getAttribute('data-theme')==='light' ? 'dark' : 'light');
});

// ── Mobile day view ─────────────────────────────────────────────────────────
let currentDay = new Date().getDay(); // 0=dom,1=lun…
// map JS day → column index (0=Lun … 6=Dom)
function jsDayToCol(d){ return d===0 ? 6 : d-1; }
let mobileCol = jsDayToCol(currentDay);

function renderMobile(){
  const container = document.getElementById('mobileDay');
  container.innerHTML = '';

  let dataRow = 0;
  SLOTS.forEach((slot)=>{
    if(slot === 'BREAK'){
      const row = document.createElement('div');
      row.className = 'mobile-slot is-break';
      const timeEl = document.createElement('div');
      timeEl.className = 'mobile-time';
      row.appendChild(timeEl);
      const lbl = document.createElement('div');
      lbl.className = 'mobile-break-label';
      lbl.textContent = '— tarde libre —';
      row.appendChild(lbl);
      container.appendChild(row);
      return;
    }

    const key = `${dataRow}-${mobileCol}`;
    const entry = data[key];

    const row = document.createElement('div');
    row.className = 'mobile-slot';

    const timeEl = document.createElement('div');
    timeEl.className = 'mobile-time';
    timeEl.innerHTML = `<span class="ts">${slot.s}</span><span class="te">${slot.e}</span>`;
    row.appendChild(timeEl);

    const cell = document.createElement('div');
    cell.className = 'mobile-cell';

    if(entry){
      const pill = document.createElement('div');
      pill.className = 'mobile-pill';
      pill.style.background = hex2rgba(entry.c, 0.22);
      pill.style.color = entry.c;
      pill.style.border = `1px solid ${hex2rgba(entry.c, 0.35)}`;
      pill.textContent = entry.t.replace(/\n/g, ' · ');
      cell.appendChild(pill);
    } else {
      const hint = document.createElement('div');
      hint.className = 'mobile-add-hint';
      hint.textContent = '+';
      cell.appendChild(hint);
    }

    cell.addEventListener('click', ()=>openModal(key, entry, slot, mobileCol));
    row.appendChild(cell);
    container.appendChild(row);
    dataRow++;
  });

  // Update dots + label
  document.getElementById('dayNavLabel').textContent = DAYS[mobileCol];
  const dots = document.getElementById('dayDots');
  dots.innerHTML = '';
  DAYS.forEach((_, i)=>{
    const d = document.createElement('div');
    d.className = 'day-dot' + (i===mobileCol?' active':'');
    dots.appendChild(d);
  });
}

document.getElementById('prevDay').addEventListener('click', ()=>{
  mobileCol = (mobileCol + 6) % 7;
  renderMobile();
});
document.getElementById('nextDay').addEventListener('click', ()=>{
  mobileCol = (mobileCol + 1) % 7;
  renderMobile();
});

// Swipe support
let touchStartX = 0;
document.getElementById('mobileDay').addEventListener('touchstart', e=>{ touchStartX=e.touches[0].clientX; }, {passive:true});
document.getElementById('mobileDay').addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx)>50){ mobileCol = dx<0 ? (mobileCol+1)%7 : (mobileCol+6)%7; renderMobile(); }
}, {passive:true});

// ── Init ────────────────────────────────────────────────────────────────────
load();
render();
renderMobile();

// ── Service Worker (offline) ─────────────────────────────────────────────────
if('serviceWorker' in navigator){
  const swCode=`
self.addEventListener('install',e=>{ self.skipWaiting(); });
self.addEventListener('fetch',e=>{
  e.respondWith(
    caches.open('horario-v1').then(cache=>
      cache.match(e.request).then(r=> r || fetch(e.request).then(res=>{
        cache.put(e.request,res.clone()); return res;
      }).catch(()=>new Response('',{status:503})))
    )
  );
});`;
  const blob=new Blob([swCode],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

// ── Banner "Agregar a pantalla de inicio" en iOS ──────────────────────────────
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.navigator.standalone===true;
if(isIOS && !isStandalone){
  try {
    const shown=localStorage.getItem('pwa-hint');
    if(!shown){
      const banner=document.createElement('div');
      banner.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d1a2b;border:1px solid #2e2a48;color:#edeaff;font-family:system-ui;font-size:13px;padding:12px 18px;border-radius:14px;z-index:999;text-align:center;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,0.5);line-height:1.5';
      banner.innerHTML='📲 Para instalar como app:<br><b>Compartir</b> → <b>Agregar a pantalla de inicio</b><br><small style="color:#8a849f;cursor:pointer" id="closeBanner">Cerrar</small>';
      document.body.appendChild(banner);
      document.getElementById('closeBanner').onclick=()=>{
        banner.remove();
        try{ localStorage.setItem('pwa-hint','1'); }catch{}
      };
    }
  }catch{}
}
</script>
</body>
</html>
