<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f0ff">
<title>Mi Semana 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;1,300&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf8ff;
  --surface:#ffffff;
  --surface2:#f5f0ff;
  --text:#4a3860;
  --text2:#9a8aaa;
  --text3:#c9bdd8;
  --cyn:#f5c8d8;
  --cyn-d:#c06080;
  --cyn-bg:#fff0f5;
  --efr:#a8d8c0;
  --efr-d:#3a7a60;
  --efr-bg:#f0fff8;
  --shared:#f0e0b0;
  --accent:#c9a8f0;
  --border:#ede5ff;
  --r:14px;
  --sh:0 2px 16px rgba(100,70,140,.08);
}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100svh;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 15% 10%,rgba(240,224,255,.6) 0%,transparent 55%),
    radial-gradient(ellipse at 85% 90%,rgba(200,240,224,.5) 0%,transparent 55%),
    radial-gradient(ellipse at 50% 50%,rgba(255,240,248,.4) 0%,transparent 70%);
}
*{position:relative;z-index:1}

/* ── WELCOME ─────────────────────────────────────── */
#welcome{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:28px;padding:32px 24px;
  background:linear-gradient(150deg,#f0e8ff 0%,#fde8f0 50%,#e8f5ee 100%);
}
#welcome h1{
  font-family:'Fraunces',serif;font-weight:300;
  font-size:clamp(2.2rem,6vw,3.2rem);
  color:var(--text);text-align:center;line-height:1.15;
}
#welcome h1 em{font-style:italic;color:var(--accent)}
#welcome .tagline{font-size:.95rem;color:var(--text2);font-style:italic;text-align:center;}
.welcome-btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.welcome-btn{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:28px 36px;background:white;
  border:2px solid var(--border);border-radius:24px;
  cursor:pointer;transition:all .2s ease;
  box-shadow:var(--sh);font-family:inherit;
}
.welcome-btn:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(100,70,140,.14);}
.welcome-btn .av{font-size:2.8rem;line-height:1;}
.welcome-btn .nm{font-size:1rem;font-weight:500;color:var(--text);}
.welcome-btn.cyn{border-color:var(--cyn);}
.welcome-btn.cyn:hover{background:var(--cyn-bg);}
.welcome-btn.efr{border-color:var(--efr);}
.welcome-btn.efr:hover{background:var(--efr-bg);}
#welcome .note{font-size:.8rem;color:var(--text3);text-align:center;max-width:260px;line-height:1.5;}

/* ── HEADER ──────────────────────────────────────── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 14px;
  position:sticky;top:0;z-index:50;
  background:rgba(250,248,255,.92);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.h-title{
  font-family:'Fraunces',serif;font-weight:300;font-style:italic;
  font-size:1.25rem;color:var(--text);
}
.user-pill{
  display:flex;align-items:center;gap:7px;
  padding:6px 14px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:20px;
  font-size:.82rem;font-weight:500;color:var(--text);
  cursor:pointer;transition:all .15s;user-select:none;
}
.user-pill:hover{background:var(--surface2);}

/* ── VIEW TABS ───────────────────────────────────── */
.view-bar{
  display:flex;gap:6px;padding:12px 20px 10px;
  border-bottom:1px solid var(--border);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.view-bar::-webkit-scrollbar{display:none;}
.v-tab{
  flex-shrink:0;padding:6px 18px;border-radius:20px;
  border:1.5px solid var(--border);background:white;
  font-family:inherit;font-size:.82rem;color:var(--text2);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.v-tab.on{
  background:linear-gradient(130deg,#c9a8f0 0%,#f0b8d0 100%);
  color:white;border-color:transparent;
  box-shadow:0 2px 12px rgba(200,168,240,.35);
}

/* ── DAY NAV (mobile week view) ───────────────────── */
.day-nav{
  display:none;align-items:center;justify-content:space-between;
  padding:14px 16px;gap:8px;
}
.dna{background:none;border:none;font-size:1.5rem;color:var(--text2);
  padding:4px 10px;border-radius:10px;cursor:pointer;transition:background .12s;}
.dna:hover{background:var(--surface2);}
.dnc{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;}
.dn-name{font-family:'Fraunces',serif;font-weight:300;font-size:1.2rem;color:var(--text);}
.dn-dots{display:flex;gap:5px;}
.dn-dot{width:6px;height:6px;border-radius:50%;background:var(--border);transition:background .2s;}
.dn-dot.on{background:var(--accent);}

/* ── MOBILE DAY VIEW ─────────────────────────────── */
.mobile-day{display:none;padding:0 12px 32px;flex-direction:column;gap:12px;}
.ps{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);}
.ps-hdr{
  display:flex;align-items:center;gap:8px;padding:11px 16px;
  font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
}
.ps-hdr.cyn{background:var(--cyn-bg);color:var(--cyn-d);}
.ps-hdr.efr{background:var(--efr-bg);color:var(--efr-d);}
.ps-body{padding:8px 10px;}
.ec{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:10px;margin-bottom:5px;
  background:var(--surface2);
}
.ec-bar{width:4px;border-radius:2px;align-self:stretch;flex-shrink:0;}
.ec-info{flex:1;min-width:0;}
.ec-name{font-size:.88rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ec-time{font-size:.73rem;color:var(--text2);margin-top:1px;}
.ec-actions{display:flex;gap:3px;align-items:center;}
.ec-btn{background:none;border:none;padding:5px;border-radius:8px;
  cursor:pointer;font-size:.85rem;opacity:.45;transition:opacity .15s;}
.ec-btn:hover{opacity:1;}
.ec-btn.del:hover{color:#d05060;}
.ec-eye{font-size:.75rem;opacity:.3;}
.no-ev{padding:12px 10px;font-size:.88rem;color:var(--text3);font-style:italic;}

/* ── DESKTOP TABLE (WEEK) ────────────────────────── */
.tbl-wrap{padding:16px 20px 32px;overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:620px;}
th{
  font-family:'Fraunces',serif;font-weight:300;font-size:.85rem;
  color:var(--text2);padding:8px 4px;text-align:center;
  border-bottom:1px solid var(--border);
}
th.td{color:var(--accent);font-weight:400;}
td{
  vertical-align:top;padding:3px;min-width:78px;height:42px;
  border:1px solid var(--border);cursor:pointer;transition:background .1s;
}
td:hover{background:var(--surface2);}
td.tc{cursor:default;font-size:.72rem;color:var(--text3);
  background:transparent !important;border:none;
  text-align:right;padding-right:8px;white-space:nowrap;width:48px;}
td.td-col{background:rgba(201,168,240,.04);}
.cev{
  display:flex;align-items:center;gap:3px;
  padding:2px 6px;border-radius:6px;
  font-size:.72rem;font-weight:500;margin-bottom:2px;cursor:pointer;
  transition:opacity .12s;user-select:none;
}
.cev:hover{opacity:.8;}
.cev.other{cursor:default;opacity:.7;}
.cev.other:hover{opacity:.7;}
.cev .cn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cev .cdel{display:none;font-size:.65rem;padding:0 2px;opacity:.6;}
.cev:not(.other):hover .cdel{display:block;}
.cev .clock{font-size:.65rem;opacity:.5;margin-left:2px;}

/* ── DAY VIEW ────────────────────────────────────── */
.view-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px 4px;
}
.view-nav-title{
  font-family:'Fraunces',serif;font-weight:300;font-size:1.15rem;color:var(--text);
}
.nav-btn{
  background:none;border:1.5px solid var(--border);border-radius:10px;
  padding:4px 14px;font-size:1.1rem;cursor:pointer;color:var(--text2);
  transition:background .12s;font-family:inherit;
}
.nav-btn:hover{background:var(--surface2);}
.day-timeline-wrap{padding:8px 20px 32px;overflow-x:auto;}
.day-timeline{
  min-width:360px;
  display:grid;grid-template-columns:52px 1fr 1fr;gap:3px;
}
.dt-head{
  font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  padding:8px 6px;text-align:center;
}
.dt-head.cyn{color:var(--cyn-d);}
.dt-head.efr{color:var(--efr-d);}
.dt-time{
  font-size:.7rem;color:var(--text3);text-align:right;
  padding:10px 8px 10px 0;white-space:nowrap;
  display:flex;align-items:flex-start;justify-content:flex-end;
}
.dt-cell{
  background:var(--surface);border-radius:8px;
  padding:4px;cursor:pointer;min-height:44px;
  transition:background .1s;border:1.5px solid transparent;
  display:flex;flex-direction:column;gap:2px;
}
.dt-cell:hover{border-color:var(--border);background:var(--surface2);}
.dt-evt{
  padding:5px 8px;border-radius:6px;
  font-size:.78rem;font-weight:500;line-height:1.3;
}
.dt-empty{min-height:44px;}

/* ── MONTH VIEW ──────────────────────────────────── */
.month-header-row{
  display:grid;grid-template-columns:repeat(7,1fr);
  padding:0 20px;margin-bottom:6px;
}
.month-dow{
  text-align:center;font-size:.72rem;color:var(--text3);
  padding:6px 0;font-family:'Fraunces',serif;
}
.month-grid-wrap{padding:0 20px 32px;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.mday{
  min-height:72px;background:var(--surface);border-radius:10px;
  padding:5px;cursor:pointer;transition:box-shadow .1s;
  border:1.5px solid transparent;overflow:hidden;
}
.mday:hover{box-shadow:var(--sh);border-color:var(--border);}
.mday.today{border-color:var(--accent);}
.mday.out{opacity:.3;cursor:default;pointer-events:none;}
.mday-num{font-size:.72rem;font-weight:600;color:var(--text2);margin-bottom:3px;}
.mday.today .mday-num{color:var(--accent);}
.mday-acts{display:flex;flex-direction:column;gap:2px;}
.mact{
  font-size:.6rem;padding:1px 5px;border-radius:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;
}
.mday-dots{display:flex;gap:2.5px;flex-wrap:wrap;margin-top:3px;}
.mdot{width:5px;height:5px;border-radius:50%;}

/* ── YEAR VIEW ───────────────────────────────────── */
.year-grid-wrap{padding:12px 20px 32px;}
.year-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:14px;
}
.mini-month{
  background:var(--surface);border-radius:var(--r);
  padding:12px;box-shadow:var(--sh);cursor:pointer;
  transition:transform .15s,box-shadow .15s;
}
.mini-month:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(100,70,140,.12);}
.mini-month-title{
  font-family:'Fraunces',serif;font-size:.85rem;color:var(--text);
  margin-bottom:8px;font-weight:400;
}
.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.mini-dow{font-size:.55rem;color:var(--text3);text-align:center;padding-bottom:3px;}
.mini-day{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border-radius:5px;font-size:.6rem;color:var(--text2);
}
.mini-day.today-cell{background:var(--accent);color:white;}
.mini-day.out-m{color:var(--text3);opacity:.4;}
.mini-day-dots{display:flex;gap:1px;margin-top:1px;}
.mini-dot{width:3px;height:3px;border-radius:50%;}

/* ── MODAL ───────────────────────────────────────── */
.ov{
  position:fixed;inset:0;z-index:100;
  background:rgba(70,50,100,.25);backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;
}
@media(min-width:500px){.ov{align-items:center;padding:20px;}}
.modal{
  background:white;border-radius:24px 24px 0 0;
  padding:20px 18px 36px;width:100%;max-width:420px;
  box-shadow:0 -4px 48px rgba(100,70,140,.15);
}
@media(min-width:500px){.modal{border-radius:24px;padding:26px;}}
.m-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 18px;}
@media(min-width:500px){.m-handle{display:none;}}
.modal h2{font-family:'Fraunces',serif;font-weight:300;font-size:1.25rem;color:var(--text);margin-bottom:18px;}
.fld{margin-bottom:14px;}
.fld label{display:block;font-size:.75rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:var(--text2);margin-bottom:6px;}
.fld input[type=text]{
  width:100%;padding:9px 13px;background:var(--surface2);
  border:1.5px solid var(--border);border-radius:10px;
  font-size:.92rem;font-family:inherit;color:var(--text);
  outline:none;transition:border-color .15s;
}
.fld input[type=text]:focus{border-color:var(--accent);}
.fld input[type=text]::placeholder{color:var(--text3);}
.swatches{display:flex;flex-wrap:wrap;gap:7px;}
.sw{width:28px;height:28px;border-radius:50%;cursor:pointer;
  border:2.5px solid transparent;transition:transform .12s,border-color .12s;}
.sw:hover{transform:scale(1.12);}
.sw.on{border-color:var(--text);transform:scale(1.08);}
.time-row{display:flex;align-items:center;gap:8px;}
.time-start{
  padding:8px 12px;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:10px;font-size:.9rem;color:var(--text2);font-family:inherit;min-width:70px;
}
.time-row input[type=time]{
  flex:1;padding:8px 12px;background:var(--surface2);
  border:1.5px solid var(--border);border-radius:10px;
  font-size:.9rem;font-family:inherit;color:var(--text);outline:none;
  transition:border-color .15s;
}
.time-row input[type=time]:focus{border-color:var(--accent);}
.time-sep{color:var(--text3);font-size:.95rem;}
.for-whom{display:flex;gap:8px;}
.fw-btn{
  flex:1;padding:9px 8px;border-radius:10px;
  border:1.5px solid var(--border);background:white;
  font-family:inherit;font-size:.83rem;font-weight:500;
  color:var(--text2);cursor:pointer;transition:all .14s;text-align:center;
}
.fw-btn.on{border-color:var(--accent);background:var(--surface2);color:var(--text);}
.m-actions{display:flex;gap:8px;margin-top:18px;}
.btn-x{
  padding:11px 13px;border-radius:12px;
  border:1.5px solid #f0c0c0;background:white;
  font-family:inherit;font-size:.88rem;color:#d06070;cursor:pointer;
  transition:background .14s;
}
.btn-x:hover{background:#fff0f0;}
.btn-cancel{
  flex:1;padding:11px;border-radius:12px;
  border:1.5px solid var(--border);background:white;
  font-family:inherit;font-size:.88rem;font-weight:500;
  color:var(--text2);cursor:pointer;transition:background .14s;
}
.btn-cancel:hover{background:var(--surface2);}
.btn-save{
  flex:2;padding:11px;border-radius:12px;
  border:none;
  background:linear-gradient(130deg,#c9a8f0 0%,#f0b8d0 100%);
  font-family:inherit;font-size:.9rem;font-weight:600;
  color:white;cursor:pointer;transition:opacity .14s;
}
.btn-save:hover{opacity:.88;}

/* ── RESPONSIVE ──────────────────────────────────── */
@media(max-width:640px){
  .tbl-wrap{display:none;}
  .day-nav{display:flex;}
  .mobile-day{display:flex;}
  .day-timeline-wrap{padding:6px 10px 24px;}
  .day-timeline{grid-template-columns:42px 1fr 1fr;min-width:0;}
  .month-header-row{padding:0 10px;}
  .month-grid-wrap{padding:0 10px 24px;}
  .mday{min-height:52px;padding:4px;}
  .mday-acts{display:none;}
  .mday-dots{display:flex;}
  .year-grid-wrap{padding:8px 10px 24px;}
  .year-grid{grid-template-columns:repeat(3,1fr);gap:8px;}
  .mini-month{padding:8px;}
  .mini-month-title{font-size:.72rem;margin-bottom:5px;}
}
@media(min-width:641px){
  .mday-dots{display:none;}
}

/* ── SETTINGS MENU ──────────────────────────────── */
.settings-menu{
  position:fixed;inset:0;z-index:150;
  background:rgba(70,50,100,.22);backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;
}
@media(min-width:500px){.settings-menu{align-items:center;padding:20px;}}
.settings-card{
  background:white;border-radius:24px 24px 0 0;
  padding:20px 18px 40px;width:100%;max-width:380px;
  box-shadow:0 -4px 48px rgba(100,70,140,.15);
}
@media(min-width:500px){.settings-card{border-radius:24px;padding:26px;}}
.settings-card h3{
  font-family:'Fraunces',serif;font-weight:300;font-size:1.1rem;
  color:var(--text);margin-bottom:16px;
}
.s-btn{
  display:flex;align-items:center;gap:10px;
  width:100%;padding:13px 16px;margin-bottom:8px;
  background:var(--surface2);border:1.5px solid var(--border);
  border-radius:12px;font-family:inherit;font-size:.9rem;
  color:var(--text);cursor:pointer;text-align:left;transition:background .12s;
}
.s-btn:hover{background:#f0e8ff;}
.s-btn.danger{color:#d05060;border-color:#f0c0c0;background:#fff8f8;}
.s-btn.danger:hover{background:#fff0f0;}
.s-close{
  width:100%;padding:11px;border-radius:12px;
  border:1.5px solid var(--border);background:white;
  font-family:inherit;font-size:.88rem;font-weight:500;
  color:var(--text2);cursor:pointer;margin-top:6px;
}
.s-close:hover{background:var(--surface2);}

/* ── TOAST ───────────────────────────────────────── */
#toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(70px);
  background:#4a3860;color:white;
  padding:9px 20px;border-radius:20px;
  font-size:.83rem;font-weight:500;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  z-index:300;pointer-events:none;white-space:nowrap;
}
#toast.show{transform:translateX(-50%) translateY(0);}

/* ── DURATION & DAY CHIPS ───────────────────────────── */
.dur-sel{
  flex:1;padding:8px 12px;background:var(--surface2);
  border:1.5px solid var(--border);border-radius:10px;
  font-size:.9rem;font-family:inherit;color:var(--text);
  outline:none;cursor:pointer;transition:border-color .15s;
  -webkit-appearance:none;appearance:none;
}
.dur-sel:focus{border-color:var(--accent);}
.dur-badge{
  font-size:.6rem;font-weight:700;opacity:.8;
  background:rgba(255,255,255,.55);padding:1px 4px;
  border-radius:3px;flex-shrink:0;margin-left:2px;
}
.day-chips{display:flex;gap:6px;flex-wrap:wrap;}
.day-chip{
  padding:5px 11px;border-radius:20px;
  border:1.5px solid var(--border);background:white;
  font-family:inherit;font-size:.78rem;font-weight:500;
  color:var(--text2);cursor:pointer;transition:all .14s;
}
.day-chip.on{border-color:var(--accent);background:var(--surface2);color:var(--text);}
</style>
</head>
<body>

<!-- ── WELCOME SCREEN ──────────────────────────────── -->
<div id="welcome">
  <div style="text-align:center">
    <div style="font-size:3rem;margin-bottom:6px">🌸</div>
    <h1>Mi Semana<br><em>a nuestro ritmo</em></h1>
  </div>
  <p class="tagline">¿Quién eres hoy?</p>
  <div class="welcome-btns">
    <button class="welcome-btn cyn" onclick="setUser('cynthia')">
      <span class="av">🌸</span>
      <span class="nm">Cynthia</span>
    </button>
    <button class="welcome-btn efr" onclick="setUser('efren')">
      <span class="av">🌿</span>
      <span class="nm">Efrén</span>
    </button>
  </div>
  <p class="note">Solo podrás editar tus propias actividades. Los eventos compartidos los ven los dos 🔒</p>
</div>

<!-- ── APP ─────────────────────────────────────────── -->
<div id="app" style="display:none">
  <header>
    <div class="h-title">mi semana 🌸</div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,doc,setDoc,getDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FB={
  apiKey:"AIzaSyAUJmtNL4ePC4W8k8Mg2EUzzryrepprgN0",
  authDomain:"horario-4bbf8.firebaseapp.com",
  projectId:"horario-4bbf8",
  storageBucket:"horario-4bbf8.firebasestorage.app",
  messagingSenderId:"146413079594",
  appId:"1:146413079594:web:eb10c22794cdb12634c753"
};
const db=getFirestore(initializeApp(FB));
const semRef=doc(db,'horario','semana');

// ── Constants ─────────────────────────────────────────────────────────────
const DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DAYS_F=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MONTHS_F=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// New SLOTS: full day, no gap between 12:00 and 18:00
const SLOTS=["7:00","8:00","9:00","10:00","11:00","12:00",
             "13:00","14:00","15:00","16:00","17:00",
             "18:00","19:00","20:00","21:00","22:30"];

const PALETTE=['#f5c8d8','#c9b8f0','#a8d8c0','#f0c8a0','#b8d8f0','#f0b8c8','#c8e8b8','#d8c8f0','#f0d8a0','#b0c8e0','#e8c8b0','#c0d8c8'];

// ── State ─────────────────────────────────────────────────────────────────
let cynD={},efrD={};
let me=localStorage.getItem('horario_user');
let mCol=todayCol();         // day column for week/mobile
let dvCol=todayCol();        // day column for day view
let mvDate=new Date();       // month view reference date
let yvYear=new Date().getFullYear(); // year view
let currentView='week';

let eKey=null,eOwner=null,selC=PALETTE[0],fw='me';
let selDays=[],curRow=0;

// ── Helpers ───────────────────────────────────────────────────────────────
function todayCol(){const d=new Date().getDay();return d===0?6:d-1;}
function emoji(n=''){
  const s=n.toLowerCase();
  if(s.includes('yoga'))return'🌿';
  if(s.includes('kryon'))return'🌙';
  if(s.includes('omm'))return'🫧';
  if(s.includes('liza'))return'🌸';
  if(s.includes('uriel'))return'🍃';
  if(s.includes('medit'))return'✨';
  if(s.includes('terapia'))return'💗';
  if(s.includes('traslado'))return'🕊️';
  if(s.includes('nadar')||s.includes('nado'))return'🏊';
  if(s.includes('gym'))return'🏋️';
  if(s.includes('clase')||s.includes('class'))return'📚';
  if(s.includes('reunion')||s.includes('junta'))return'🤝';
  if(s.includes('desayuno')||s.includes('comida')||s.includes('cena'))return'🍽️';
  return'🌼';
}
function myD(){return me==='cynthia'?cynD:efrD;}
function othD(){return me==='cynthia'?efrD:cynD;}
function other(){return me==='cynthia'?'efren':'cynthia';}
function label(w){return w==='cynthia'?'Cynthia':'Efrén';}
function emo(w){return w==='cynthia'?'🌸':'🌿';}
function cls(w){return w==='cynthia'?'cyn':'efr';}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
function slotForRow(row){return SLOTS[row]||'';}

function durLabel(m){
  if(m===15)return'¼';
  if(m===30)return'½';
  if(m===45)return'¾';
  if(m%60===0&&m>0)return`${m/60}h`;
  return`${Math.floor(m/60)}h${m%60}`;
}
function populateDurSel(startSlot,existingDur){
  const parts=startSlot.split(':');
  const startMin=parseInt(parts[0])*60+(parseInt(parts[1])||0);
  const sel=document.getElementById('mDur');
  sel.innerHTML='';
  const defaultDur=existingDur||60;
  for(let endMin=startMin+15;endMin<=23*60+45;endMin+=15){
    const dur=endMin-startMin;
    const eh=Math.floor(endMin/60);
    const em=(endMin%60).toString().padStart(2,'0');
    const endStr=`${eh}:${em}`;
    let durStr;
    if(dur<60)durStr=`${dur} min`;
    else if(dur%60===0)durStr=`${dur/60}h`;
    else durStr=`${Math.floor(dur/60)}h ${dur%60}min`;
    const opt=document.createElement('option');
    opt.value=dur;
    opt.textContent=`${endStr}  (${durStr})`;
    if(dur===defaultDur)opt.selected=true;
    sel.appendChild(opt);
  }
  if(!sel.value&&sel.options[3])sel.options[3].selected=true;
}
function renderDayChips(defaultCol){
  selDays=[defaultCol];
  document.getElementById('dayChips').innerHTML=
    DAYS.map((d,i)=>`<button class="day-chip${i===defaultCol?' on':''}" onclick="toggleDay(${i},this)">${d}</button>`).join('');
}
window.toggleDay=function(col,btn){
  const idx=selDays.indexOf(col);
  if(idx>-1){if(selDays.length>1){selDays.splice(idx,1);btn.classList.remove('on');}}
  else{selDays.push(col);btn.classList.add('on');}
};

// Get all entries for a given column (day of week)
function colEntries(data,col){
  const out=[];
  SLOTS.forEach((s,i)=>{
    const e=data[`${i}-${col}`];
    if(e)out.push({slot:s,row:i,entry:e});
  });
  return out;
}

// (migration removed — data is re-entered cleanly with new SLOTS)

// ── Identity ──────────────────────────────────────────────────────────────
window.setUser=function(who){
  me=who;localStorage.setItem('horario_user',who);
  document.getElementById('welcome').style.display='none';
  document.getElementById('app').style.display='';
  document.getElementById('uEmoji').textContent=emo(who);
  document.getElementById('uName').textContent=label(who);
  startSync();
};
window.promptSwitch=function(){
  const o=other();
  if(confirm(`¿Cambiar a ${label(o)} ${emo(o)}?\n\nPodrás ver y editar tu horario.`))setUser(o);
};

// ── Save / Sync ──────────────────────────────────────────────────────────
let skipNext=false;
async function persistAll(){
  const payload={cynthia:JSON.stringify(cynD),efren:JSON.stringify(efrD)};
  try{await setDoc(semRef,payload,{merge:true});}catch(e){console.error('save',e);}
}
function saveCyn(){localStorage.setItem('h_cyn',JSON.stringify(cynD));skipNext=true;persistAll();}
function saveEfr(){localStorage.setItem('h_efr',JSON.stringify(efrD));skipNext=true;persistAll();}

try{cynD=JSON.parse(localStorage.getItem('h_cyn')||'{}');}catch{}
try{efrD=JSON.parse(localStorage.getItem('h_efr')||'{}');}catch{}

async function startSync(){
  try{
    const snap=await getDoc(semRef);
    if(snap.exists()){
      const d=snap.data();
      if(d.cynthia){
        try{cynD=JSON.parse(d.cynthia);}catch{}
      } else if(d.data){
        try{
          const old=JSON.parse(d.data);
          Object.keys(old).forEach(k=>{if(typeof old[k]==='object')old[k].owner='cynthia';});
          cynD=old;
          await setDoc(semRef,{cynthia:JSON.stringify(cynD)},{merge:true});
          toast('Horario recuperado ✨');
        }catch(e){console.error('migrate',e);}
      }
      if(d.efren){
        try{efrD=JSON.parse(d.efren);}catch{}
      }
    }
  }catch(e){console.error('startSync',e);}

  localStorage.setItem('h_cyn',JSON.stringify(cynD));
  localStorage.setItem('h_efr',JSON.stringify(efrD));
  renderAll();

  onSnapshot(semRef,snap=>{
    if(skipNext){skipNext=false;return;}
    if(!snap.exists())return;
    const d=snap.data();
    let changed=false;
    if(d.cynthia)try{cynD=JSON.parse(d.cynthia);localStorage.setItem('h_cyn',JSON.stringify(cynD));changed=true;}catch{}
    if(d.efren)try{efrD=JSON.parse(d.efren);localStorage.setItem('h_efr',JSON.stringify(efrD));changed=true;}catch{}
    if(changed)renderAll();
  });
}

function renderAll(){
  render();renderM();
  if(currentView==='day')renderDay();
  else if(currentView==='month')renderMonth();
  else if(currentView==='year')renderYear();
}

// ── View switching ────────────────────────────────────────────────────────
window.switchView=function(v,btn){
  currentView=v;
  document.querySelectorAll('.v-tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  ['vWeek','vDay','vMonth','vYear'].forEach(id=>{
    document.getElementById(id).style.display='none';
  });
  if(v==='week'){document.getElementById('vWeek').style.display='';render();renderM();}
  else if(v==='day'){document.getElementById('vDay').style.display='';renderDay();}
  else if(v==='month'){document.getElementById('vMonth').style.display='';renderMonth();}
  else if(v==='year'){document.getElementById('vYear').style.display='';renderYear();}
};

// ── WEEK VIEW: Render desktop table ───────────────────────────────────────
function render(){
  const tbl=document.getElementById('tbl');
  const td=todayCol();
  // Build span + occupied maps for rowspan support
  const spanMap={},occ={};
  SLOTS.forEach((s,i)=>{
    for(let col=0;col<7;col++){
      const k=`${i}-${col}`;
      const ce=cynD[k],ee=efrD[k];
      if(!ce&&!ee)return;
      const maxDur=Math.max(ce?.dur||60,ee?.dur||60);
      const sp=Math.min(Math.ceil(maxDur/60),SLOTS.length-i);
      if(sp>1){spanMap[k]=sp;for(let r=i+1;r<i+sp;r++)occ[`${r}-${col}`]=true;}
    }
  });
  let h='<tr><th class="tc"></th>';
  DAYS.forEach((d,i)=>{h+=`<th class="${i===td?'td':''}${i===td?' td':''}">${d}</th>`;});
  h+='</tr>';
  SLOTS.forEach((s,i)=>{
    h+='<tr>';
    h+=`<td class="tc">${s}</td>`;
    for(let col=0;col<7;col++){
      if(occ[`${i}-${col}`])continue; // covered by rowspan above
      const k=`${i}-${col}`;
      const ce=cynD[k],ee=efrD[k];
      const rs=spanMap[k]||1;
      const rsA=rs>1?` rowspan="${rs}"`:'';
      const tdCls=col===td?'td-col':'';
      h+=`<td class="${tdCls}"${rsA} onclick="cellCk(${i},${col},event)">`;
      if(ce)h+=cellEvt(ce,i,col,'cynthia');
      if(ee)h+=cellEvt(ee,i,col,'efren');
      h+='</td>';
    }
    h+='</tr>';
  });
  tbl.innerHTML=h;
}
function cellEvt(e,row,col,owner){
  const canE=me===owner&&(!e.owner||e.owner===owner);
  const bg=e.c+'44';const txt=e.c;
  const lk=e.shared?'🔒':'';
  const oth=canE?'':'other';
  const clk=canE?`onclick="openEdit('${owner}','${row}-${col}',event)"`:'onclick="otherTap(event)"';
  const del=canE&&!e.shared?`<span class="cdel" onclick="delCell(event,'${owner}','${row}-${col}')">✕</span>`:'';
  const db=(e.dur&&e.dur!==60)?`<span class="dur-badge">${durLabel(e.dur)}</span>`:'';
  return`<div class="cev ${oth}" style="background:${bg};color:${txt}" ${clk}>
    <span>${emoji(e.t)}</span><span class="cn">${e.t}${lk}</span>${db}${del}
  </div>`;
}

// ── WEEK VIEW: Render mobile ──────────────────────────────────────────────
function renderM(){
  const col=mCol;
  document.getElementById('dnName').textContent=DAYS_F[col];
  document.getElementById('dnDots').innerHTML=DAYS.map((_,i)=>`<div class="dn-dot${i===col?' on':''}"></div>`).join('');
  const wrap=document.getElementById('mDay');
  wrap.innerHTML='';
  wrap.appendChild(personSec('cynthia',col));
  wrap.appendChild(personSec('efren',col));
}
function personSec(who,col){
  const data=who==='cynthia'?cynD:efrD;
  const sec=document.createElement('div');sec.className='ps';
  const hdr=document.createElement('div');
  hdr.className=`ps-hdr ${cls(who)}`;
  hdr.textContent=`${emo(who)} ${label(who)}`;
  sec.appendChild(hdr);
  const body=document.createElement('div');body.className='ps-body';
  let found=false;
  SLOTS.forEach((s,i)=>{
    const e=data[`${i}-${col}`];
    if(e){
      found=true;
      const canE=me===who&&(!e.owner||e.owner===who);
      const tStr=e.endTime?`${s} → ${e.endTime}`:s;
      const card=document.createElement('div');card.className='ec';
      card.innerHTML=`
        <div class="ec-bar" style="background:${e.c}"></div>
        <div class="ec-info">
          <div class="ec-name">${emoji(e.t)} ${e.t}${e.shared?'🔒':''}</div>
          <div class="ec-time">${tStr}</div>
        </div>
        <div class="ec-actions">
          ${canE&&!e.shared?`<button class="ec-btn del" onclick="delCell(event,'${who}','${i}-${col}')">🗑</button>`:''}
          ${canE?`<button class="ec-btn" onclick="openEdit('${who}','${i}-${col}',event)">✏️</button>`:''}
          ${!canE?`<span class="ec-eye">👁</span>`:''}
        </div>`;
      body.appendChild(card);
    }
  });
  if(!found){
    const emp=document.createElement('div');emp.className='no-ev';
    emp.textContent='Día libre 🌱';body.appendChild(emp);
  }
  sec.appendChild(body);return sec;
}

// ── DAY VIEW ──────────────────────────────────────────────────────────────
window.shiftDV=function(d){dvCol=(dvCol+d+7)%7;renderDay();};
function renderDay(){
  const col=dvCol;
  document.getElementById('dvTitle').textContent=`${DAYS_F[col]}`;
  const tl=document.getElementById('dayTimeline');
  let h='';
  // header row
  h+=`<div class="dt-head" style="color:var(--text3)"></div>`;
  h+=`<div class="dt-head cyn">🌸 Cynthia</div>`;
  h+=`<div class="dt-head efr">🌿 Efrén</div>`;
  SLOTS.forEach((s,i)=>{
    const cynE=cynD[`${i}-${col}`];
    const efrE=efrD[`${i}-${col}`];
    h+=`<div class="dt-time">${s}</div>`;
    // Cynthia cell
    h+=`<div class="dt-cell" onclick="cellCkDV(${i},${col},'cynthia',event)">`;
    if(cynE){
      const canE=me==='cynthia';
      const del=canE&&!cynE.shared?`<span style="float:right;opacity:.4;cursor:pointer;font-size:.65rem" onclick="delCell(event,'cynthia','${i}-${col}')">✕</span>`:'';
      h+=`<div class="dt-evt" style="background:${cynE.c}44;color:${cynE.c}">${emoji(cynE.t)} ${cynE.t}${cynE.endTime?` → ${cynE.endTime}`:''}${del}</div>`;
    }
    h+='</div>';
    // Efrén cell
    h+=`<div class="dt-cell" onclick="cellCkDV(${i},${col},'efren',event)">`;
    if(efrE){
      const canE=me==='efren';
      const del=canE&&!efrE.shared?`<span style="float:right;opacity:.4;cursor:pointer;font-size:.65rem" onclick="delCell(event,'efren','${i}-${col}')">✕</span>`:'';
      h+=`<div class="dt-evt" style="background:${efrE.c}44;color:${efrE.c}">${emoji(efrE.t)} ${efrE.t}${efrE.endTime?` → ${efrE.endTime}`:''}${del}</div>`;
    }
    h+='</div>';
  });
  tl.innerHTML=h;
}
window.cellCkDV=function(row,col,owner,e){
  if(e.target.closest('.dt-evt'))return;
  // Can only add to own column
  if(owner!==me){otherTap(e);return;}
  openModal(row,col,null,null);
};

// ── MONTH VIEW ────────────────────────────────────────────────────────────
window.shiftMV=function(d){
  mvDate=new Date(mvDate.getFullYear(),mvDate.getMonth()+d,1);
  renderMonth();
};
function renderMonth(){
  const year=mvDate.getFullYear();
  const month=mvDate.getMonth();
  document.getElementById('mvTitle').textContent=`${MONTHS_F[month]} ${year}`;

  // Day of week headers Mon-Sun
  document.getElementById('monthDowRow').innerHTML=
    DAYS.map(d=>`<div class="month-dow">${d}</div>`).join('');

  const today=new Date();
  const firstDay=new Date(year,month,1);
  const lastDay=new Date(year,month+1,0);
  // Monday-based: getDay() 0=Sun,1=Mon..6=Sat → Mon=0..Sun=6
  let startOff=firstDay.getDay()-1;
  if(startOff<0)startOff=6; // Sunday → index 6

  let h='';
  // Empty cells before first day
  for(let i=0;i<startOff;i++)h+=`<div class="mday out"></div>`;

  for(let d=1;d<=lastDay.getDate();d++){
    const date=new Date(year,month,d);
    const isToday=date.toDateString()===today.toDateString();
    const dow=date.getDay();
    const col=dow===0?6:dow-1;
    // Gather activities for this day
    const cynActs=colEntries(cynD,col);
    const efrActs=colEntries(efrD,col);
    const allActs=[...cynActs,...efrActs];
    const dots=allActs.slice(0,5).map(a=>`<div class="mdot" style="background:${a.entry.c}"></div>`).join('');
    const acts=allActs.slice(0,3).map(a=>`<div class="mact" style="background:${a.entry.c}44;color:${a.entry.c}">${emoji(a.entry.t)} ${a.entry.t}</div>`).join('');
    h+=`<div class="mday${isToday?' today':''}" onclick="goDayView(${col})">
      <div class="mday-num">${d}</div>
      <div class="mday-acts">${acts}</div>
      <div class="mday-dots">${dots}</div>
    </div>`;
  }
  document.getElementById('monthGrid').innerHTML=h;
}

// ── YEAR VIEW ─────────────────────────────────────────────────────────────
window.shiftYV=function(d){yvYear+=d;renderYear();};
function renderYear(){
  document.getElementById('yvTitle').textContent=`${yvYear}`;
  const today=new Date();
  let h='';
  for(let m=0;m<12;m++){
    const firstDay=new Date(yvYear,m,1);
    const lastDay=new Date(yvYear,m+1,0);
    let startOff=firstDay.getDay()-1;
    if(startOff<0)startOff=6;
    let miniH=`<div class="mini-month" onclick="goMonthView(${m})">`;
    miniH+=`<div class="mini-month-title">${MONTHS_F[m]}</div>`;
    miniH+=`<div class="mini-cal">`;
    miniH+=DAYS.map(d=>`<div class="mini-dow">${d[0]}</div>`).join('');
    for(let i=0;i<startOff;i++)miniH+=`<div></div>`;
    for(let d=1;d<=lastDay.getDate();d++){
      const date=new Date(yvYear,m,d);
      const isToday=date.toDateString()===today.toDateString();
      const dow=date.getDay();
      const col=dow===0?6:dow-1;
      const cynActs=colEntries(cynD,col);
      const efrActs=colEntries(efrD,col);
      const allActs=[...cynActs,...efrActs];
      const dots=allActs.slice(0,3).map(a=>`<div class="mini-dot" style="background:${a.entry.c}"></div>`).join('');
      miniH+=`<div class="mini-day${isToday?' today-cell':''}">
        <div>${d}</div>
        ${dots?`<div class="mini-day-dots">${dots}</div>`:''}
      </div>`;
    }
    miniH+='</div></div>';
    h+=miniH;
  }
  document.getElementById('yearGrid').innerHTML=h;
}

// Navigate from year → month
window.goMonthView=function(m){
  mvDate=new Date(yvYear,m,1);
  document.querySelectorAll('.v-tab').forEach((t,i)=>{t.classList.toggle('on',i===2);});
  switchView('month',document.querySelectorAll('.v-tab')[2]);
};

// Navigate from month → day
window.goDayView=function(col){
  dvCol=col;
  document.querySelectorAll('.v-tab').forEach((t,i)=>{t.classList.toggle('on',i===1);});
  switchView('day',document.querySelectorAll('.v-tab')[1]);
};

// ── Modal ─────────────────────────────────────────────────────────────────
window.cellCk=function(row,col,e){
  if(e.target.closest('.cev'))return;
  openModal(row,col,null,null);
};
window.otherTap=function(e){
  e.stopPropagation();toast('Puedes ver pero no editar este evento 👁');
};
window.openEdit=function(owner,key,e){
  e&&e.stopPropagation();
  const[row,col]=key.split('-').map(Number);
  openModal(row,col,owner,key);
};
function openModal(row,col,owner,key){
  eKey=key||`${row}-${col}`;
  eOwner=owner;
  curRow=row;
  const slot=slotForRow(row);
  const existing=owner==='cynthia'?cynD[eKey]:owner==='efren'?efrD[eKey]:null;
  document.getElementById('mTitle').textContent=existing?'Editar actividad':'Nueva actividad';
  document.getElementById('mName').value=existing?.t||'';
  document.getElementById('mStart').textContent=slot||'—';
  populateDurSel(slot||'7:00',existing?.dur||60);
  document.getElementById('mDel').style.display=existing&&!existing.shared?'block':'none';
  document.getElementById('daysField').style.display=existing?'none':'';
  selC=existing?.c||PALETTE[0];
  fw=existing?.shared?'both':'me';
  renderSw();
  renderDayChips(col);
  document.querySelectorAll('.fw-btn').forEach(b=>b.classList.toggle('on',b.dataset.v===fw));
  document.getElementById('ov').style.display='flex';
  setTimeout(()=>document.getElementById('mName').focus(),100);
}
window.closeModal=function(){document.getElementById('ov').style.display='none';eKey=null;eOwner=null;};
window.ovClick=function(e){if(e.target===document.getElementById('ov'))closeModal();};
window.setFW=function(val,btn){
  fw=val;
  document.querySelectorAll('.fw-btn').forEach(b=>b.classList.toggle('on',b.dataset.v===val));
};
function renderSw(){
  document.getElementById('swatches').innerHTML=PALETTE.map(c=>
    `<div class="sw${c===selC?' on':''}" style="background:${c}" onclick="pickC('${c}')"></div>`
  ).join('');
}
window.pickC=function(c){selC=c;renderSw();};

window.saveEvt=function(){
  const name=document.getElementById('mName').value.trim();
  if(!name){document.getElementById('mName').focus();return;}
  const dur=parseInt(document.getElementById('mDur').value)||60;
  const shared=fw==='both';
  const entry={t:name,c:selC,owner:me,shared,dur};
  const row=curRow;
  const sp=Math.ceil(dur/60);
  // If editing, only update current key; if new, write to all selDays
  const days=eOwner?[parseInt(eKey.split('-')[1])]:selDays;

  function writeToData(data,col){
    const k=`${row}-${col}`;
    data[k]={...entry};
    // Clear slots covered by this span
    for(let r=row+1;r<row+sp&&r<SLOTS.length;r++)delete data[`${r}-${col}`];
  }

  days.forEach(col=>{
    if(me==='cynthia')writeToData(cynD,col);
    else writeToData(efrD,col);
    if(shared){
      if(me==='cynthia')writeToData(efrD,col);
      else writeToData(cynD,col);
    }
  });

  if(me==='cynthia')saveCyn(); else saveEfr();
  if(shared){if(me==='cynthia')saveEfr(); else saveCyn();}
  closeModal();renderAll();
  const multi=days.length>1?` (${days.length} días)`:'';
  toast(shared?`Guardado para los dos 🌸🌿`:`Guardado${multi} ✨`);
};

window.delCell=function(e,owner,key){
  e.stopPropagation();
  const data=owner==='cynthia'?cynD:efrD;
  const ent=data[key];
  if(!ent)return;
  if(ent.shared){toast('Este evento es compartido 🔒');return;}
  if(owner!==me){toast('Solo puedes borrar tus propios eventos 🌿');return;}
  if(confirm(`¿Borrar "${ent.t}"?`)){
    if(owner==='cynthia'){delete cynD[key];saveCyn();}
    else{delete efrD[key];saveEfr();}
    renderAll();toast('Eliminado 🌱');
  }
};
window.deleteEvt=function(){
  if(!eKey||!eOwner)return;
  const data=eOwner==='cynthia'?cynD:efrD;
  const ent=data[eKey];
  if(ent?.shared){toast('Evento compartido 🔒');return;}
  if(confirm(`¿Borrar "${ent?.t}"?`)){
    closeModal();
    if(eOwner==='cynthia'){delete cynD[eKey];saveCyn();}
    else{delete efrD[eKey];saveEfr();}
    renderAll();toast('Eliminado 🌱');
  }
};

// ── Settings ──────────────────────────────────────────────────────────────
window.openSettings=function(){document.getElementById('settingsMenu').style.display='flex';};
window.closeSettings=function(){document.getElementById('settingsMenu').style.display='none';};
window.settingsOverlayClick=function(e){if(e.target===document.getElementById('settingsMenu'))closeSettings();};

window.clearMyData=function(){
  if(!confirm(`¿Limpiar TODO el horario de ${label(me)} ${emo(me)}?\n\nEsta acción no se puede deshacer.`))return;
  closeSettings();
  if(me==='cynthia'){cynD={};saveCyn();}
  else{efrD={};saveEfr();}
  renderAll();
  toast(`Horario de ${label(me)} limpiado 🌱`);
};

window.clearAllData=function(){
  if(!confirm('⚠️ ¿Limpiar el horario de TODOS (Cynthia y Efrén)?\n\nEsta acción no se puede deshacer.'))return;
  closeSettings();
  cynD={};efrD={};
  localStorage.removeItem('h_cyn');localStorage.removeItem('h_efr');
  skipNext=true;
  setDoc(semRef,{cynthia:'{}',efren:'{}'},{ merge:false }).catch(console.error);
  renderAll();
  toast('Horario limpiado 🌱');
};

window.exportData=function(){
  const payload={cynthia:cynD,efren:efrD};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='mi-semana-backup.json';a.click();
  URL.revokeObjectURL(url);
  closeSettings();
  toast('Backup descargado 📋');
};

// ── Day nav (week mobile) ─────────────────────────────────────────────────
window.shiftDay=function(d){mCol=(mCol+d+7)%7;renderM();};
let tx=0;
const mdEl=document.getElementById('mDay');
mdEl.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
mdEl.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>48){mCol=dx<0?(mCol+1)%7:(mCol+6)%7;renderM();}
},{passive:true});

// ── Init ──────────────────────────────────────────────────────────────────
if(me){setUser(me);}
else{document.getElementById('welcome').style.display='flex';}
</script>
